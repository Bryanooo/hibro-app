name: Hibro
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  Hibro:
    type: application
    platform: iOS
    sources:
      - path: Hibro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryan.hibro
        PRODUCT_NAME: Hibro
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Hibro/Resources/Info.plist
    scheme:
      testTargets:
        - HibroTests
        - HibroUITests
  HibroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HibroTests
    dependencies:
      - target: Hibro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryan.hibro.tests
        GENERATE_INFOPLIST_FILE: YES
  HibroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HibroUITests
    dependencies:
      - target: Hibro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryan.hibro.uitests
        GENERATE_INFOPLIST_FILE: YES
